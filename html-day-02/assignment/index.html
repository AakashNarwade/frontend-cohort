<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Assignment 2</title>
  </head>
  <body>
    <div>
      <h1>This is assignment 2</h1>

      <!-- Table Section -->
      <table border="1">
        <thead>
          <tr>
            <th>Name</th>
            <th>Color</th>
            <th>Taste</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>Apple</td>
            <td>Red</td>
            <td>Sweet</td>
          </tr>
          <tr>
            <td>Mango</td>
            <td>Yellow</td>
            <td>Sweet</td>
          </tr>
          <tr>
            <td>Strawberry</td>
            <td>Red</td>
            <td>Sweet</td>
          </tr>
        </tbody>
      </table>

      <!-- Unordered List -->
      <ul>
        <li>Batman</li>
        <li>Spiderman</li>
        <li>Superman</li>
        <li>Hulk</li>
        <li>Thanos</li>
      </ul>

      <!-- Ordered List -->
      <ol>
        <li>Gym</li>
        <li>Study</li>
        <li>Meditate</li>
      </ol>

      <!-- Form Section with Full Validation -->
      <form action="#">
        <!-- Name Input -->
        <label for="user-name">Name:</label>
        <input
          type="text"
          id="user-name"
          name="username"
          minlength="3"
          maxlength="50"
          placeholder="Enter name"
          required
        />
        <br />

        <!-- Email Input -->
        <label for="user-email">Email:</label>
        <input
          type="email"
          id="user-email"
          name="email"
          placeholder="Enter your email"
          required
        />
        <br />

        <!-- Gender Radio Buttons (Required Validation Added) -->
        <span>Gender:</span>
        <input type="radio" name="Gender" value="male" required />
        <label for="male">Male</label>

        <input type="radio" name="Gender" value="female" required />
        <label for="female">Female</label>

        <input type="radio" name="Gender" value="other" required />
        <label for="other">Other</label>
        <br />

        <!-- Age Dropdown -->
        <label for="age-range">Select your age range:</label>
        <select id="age-range" name="age_range" required>
          <option value="" disabled selected>Choose an age range</option>
          <option value="under-18">Under 18</option>
          <option value="18-24">18–24</option>
          <option value="25-34">25–34</option>
          <option value="35-44">35–44</option>
          <option value="45-54">45–54</option>
          <option value="55-64">55–64</option>
          <option value="65-plus">65 or older</option>
          <option value="prefer-not-to-say">Prefer not to say</option>
        </select>
        <br />

        <!-- Newsletter Checkbox -->
        <input type="checkbox" name="newsletter" />
        <label for="newsletter">Receive updates for newsletter</label>
        <br />

        <!-- Submit Button -->
        <button type="submit">Submit</button>
      </form>
    </div>
  </body>
</html>
