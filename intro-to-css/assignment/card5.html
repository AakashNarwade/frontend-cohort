<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Card 5</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="card5-container">
      <h2>🏢</h2>
      <h1 class="card5-heading">Your Company</h1>
      <p class="card3-para">
        Tell us about your company. You will be able to invite your teammates in
        the next step.
        <strong>7 days.</strong>
      </p>
      <form class="card5-form" action="">
        <label for="">Company name</label>
        <br />
        <input class="card5-input" type="text" value="Zest" />
        <br />
        <label for="industry">Industry (optional)</label>
        <br />

        <select name="industry" id="industry">
          <option value="creative-agency">🎨Creative agency</option>
          <option value="saas">🖥️ Saas</option>
          <option value="ai-ventures">👨‍💻AI Ventures</option>
        </select>
        <br />
        <label for="role">Your role(optional)</label>
        <br />
        <select name="role" id="role">
          <!-- <i class="fa-solid fa-caret-down"></i> -->
          <option value="Owner /Founder/ CEO">🎯Owner/ Founder /CEO</option>
          <option value="CTO">🖥️ CTO</option>
          <option value="vice-president">👨‍💻Vice President</option>
        </select>
        <br />
        <label for="">Company size(optional)</label>
        <br />
        <select name="company-size" id="company-size">
          <option value="2-19">2-10</option>
          <option value="11-50">11-50</option>
          <option value="51-200">51-200</option>
        </select>
      </form>
      <button class="btn">
        <a href="./index.html"> Back to Main Page </a>
      </button>
    </div>
  </body>
</html>
