<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Card 1</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="card3-container">
      <h2>📞</h2>
      <h1 class="card3-heading">Phone Number</h1>
      <p class="card3-para">
        Would you like a new OpenPhone number, or want to port your existing
        number over?
      </p>
      <div class="card3-newnumber-div">
        <div>🎁 <span>Brand new number</span></div>
        <div>➡️</div>
      </div>
      <div class="card3-existingnum-div">
        <div>➡️ <span>Port existing number</span></div>
      </div>
      <p class="card3-note">
        If you choose to port your existing number, you will be given a
        temporary OpenPhone number to test things out with during the porting
        process.
      </p>

      <button class="btn">
        <a href="./index.html"> Back to Main Page </a>
      </button>
    </div>
  </body>
</html>
