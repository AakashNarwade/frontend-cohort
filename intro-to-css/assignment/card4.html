<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Card 4</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="card4-container">
      <h2>💳</h2>
      <h1 class="card4-heading">Card Details</h1>
      <p class="card3-para">
        Enter your card details to kick-start your free trial. Don't worry you
        won't be charged a dime until your free trial ends in
        <strong>7 days.</strong>
      </p>

      <div class="card4-input-wrap">
        <span class="card4-input-icon">
          <i class="fa fa-credit-card"></i>
        </span>
        <input class="card4-input" type="text" placeholder="Card number" />

        <span class="card4-right-placeholders">
          <span>MM/YY</span>
          <span>CVC</span>
        </span>
      </div>

      <button class="card4-btn">Start your 7-day free trial</button>
      <p class="card4-note"><span>🔐</span> Secure and encrypyted</p>

      <button class="btn">
        <a href="./index.html"> Back to Main Page </a>
      </button>
    </div>
  </body>
</html>
